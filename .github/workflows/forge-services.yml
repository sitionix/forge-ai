name: Forge Services

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-knowledge:
    name: Forge Knowledge
    runs-on: ubuntu-latest
    env:
      FORGE_AI_HOME: ${{ github.workspace }}
      FORGE_CONFIG_DIR: ${{ github.workspace }}/config
      FORGE_RUNTIME_DIR: ${{ runner.temp }}/forge-runtime
      FORGE_WORKSPACE_ROOT: ${{ github.workspace }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/forge-knowledge/pyproject.toml

      - name: Install dependencies
        working-directory: services/forge-knowledge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Lint
        working-directory: services/forge-knowledge
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Typecheck
        working-directory: services/forge-knowledge
        run: python -m mypy src

      - name: Unit and Forge IT tests
        working-directory: services/forge-knowledge
        run: python -m pytest

  forge-jarvis:
    name: Forge Jarvis
    runs-on: ubuntu-latest
    env:
      FORGE_AI_HOME: ${{ github.workspace }}
      FORGE_CONFIG_DIR: ${{ github.workspace }}/config
      FORGE_RUNTIME_DIR: ${{ runner.temp }}/forge-runtime
      FORGE_WORKSPACE_ROOT: ${{ github.workspace }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/forge-jarvis/pyproject.toml

      - name: Install dependencies
        working-directory: services/forge-jarvis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Lint
        working-directory: services/forge-jarvis
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Typecheck
        working-directory: services/forge-jarvis
        run: python -m mypy src

      - name: Unit and Forge IT tests
        working-directory: services/forge-jarvis
        run: python -m pytest

  forge-console:
    name: Forge Console
    runs-on: ubuntu-latest
    env:
      FORGE_AI_HOME: ${{ github.workspace }}
      FORGE_CONFIG_DIR: ${{ github.workspace }}/config
      FORGE_RUNTIME_DIR: ${{ runner.temp }}/forge-runtime
      FORGE_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/forge-console/package-lock.json

      - name: Install dependencies
        working-directory: services/forge-console
        run: npm ci

      - name: Typecheck
        working-directory: services/forge-console
        run: npm run typecheck

      - name: Unit tests
        working-directory: services/forge-console
        run: npm test

      - name: Build
        working-directory: services/forge-console
        run: npm run build
