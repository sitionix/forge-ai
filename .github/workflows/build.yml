name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Create Maven settings for private GitHub Packages
        shell: bash
        env:
          MAVEN_REPOSITORY_USERNAME: ${{ vars.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_TOKEN: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
        run: |
          cat > .maven-settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-forge-it</id>
                <username>${MAVEN_REPOSITORY_USERNAME}</username>
                <password>${MAVEN_REPOSITORY_TOKEN}</password>
              </server>
              <server>
                <id>github-app-afesox</id>
                <username>${MAVEN_REPOSITORY_USERNAME}</username>
                <password>${MAVEN_REPOSITORY_TOKEN}</password>
              </server>
              <server>
                <id>github-forge-security</id>
                <username>${MAVEN_REPOSITORY_USERNAME}</username>
                <password>${MAVEN_REPOSITORY_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build
        run: mvn -B -ntp -s .maven-settings.xml verify
