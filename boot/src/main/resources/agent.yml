agents:
  - id: analyzer
    enabled: true
    scope_mode: per_scope
    groups: [ backend, frontend ]
    depends_on: [ ]
    produces: [ architect, qa_lead ]

  - id: architect
    enabled: true
    scope_mode: per_scope
    groups: [ backend, frontend ]
    depends_on: [ analyzer ]
    produces: [ implement_be, implement_fe, api, event ]

  - id: api
    enabled: true
    scope_mode: global
    groups: [ backend, frontend ]
    depends_on: [ architect ]
    produces: [ implement_be, implement_fe ]

  - id: event
    enabled: true
    scope_mode: global
    groups: [ backend ]
    depends_on: [ architect ]
    produces: [ implement_be ]

  - id: qa_lead
    enabled: false
    scope_mode: per_scope
    groups: [ backend, frontend ]
    depends_on: [ analyzer ]
    produces: [ test_it, test_ui ]

  - id: implement_be
    enabled: true
    scope_mode: per_scope
    groups: [ backend ]
    depends_on: [ architect, api, event ]
    produces: [ test_unit, test_it ]

  - id: implement_fe
    enabled: true
    scope_mode: per_scope
    groups: [ frontend ]
    depends_on: [ architect, api ]
    produces: [ test_ui ]

  - id: test_unit
    enabled: true
    scope_mode: per_scope
    groups: [ backend ]
    depends_on: [ implement_be ]
    produces: [ ]

  - id: test_it
    enabled: true
    scope_mode: per_scope
    groups: [ backend ]
    depends_on: [ implement_be, qa_lead ]
    produces: [ ]

  - id: test_ui
    enabled: true
    scope_mode: per_scope
    groups: [ frontend ]
    depends_on: [ implement_fe, qa_lead ]
    produces: [ ]
