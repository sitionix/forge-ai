<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI Services</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="services">
  <main class="shell services-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Forge AI Operator</p>
        <h1>Services</h1>
        <p class="muted">Configured services from services.yaml.</p>
      </div>
      <div class="hero-actions">
        <button id="refreshServices" class="button">Refresh</button>
      </div>
    </header>

    <div id="servicesActionResult" class="notice-box hidden"></div>
    <div id="servicesError" class="error-box hidden"></div>

    <section class="panel services-list-panel">
      <div class="panel-head compact">
        <div>
          <h2>Catalog</h2>
          <p>Click a service to inspect local workspace, runtime, contracts, and database state.</p>
        </div>
      </div>
      <div id="operatorServicesList" class="operator-services-list"></div>
    </section>
  </main>

  <script src="./operator-ui.js"></script>
</body>
</html>
