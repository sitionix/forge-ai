<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI Operator</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="tickets">
  <nav class="side-nav" aria-label="Operator navigation">
    <button id="navToggle" class="nav-toggle" type="button" aria-label="Toggle navigation">Menu</button>
    <a class="nav-brand" href="./index.html">Forge AI</a>
    <a class="nav-link active" href="./index.html" data-short="T">Tickets</a>
    <a class="nav-link" href="./agents.html" data-short="A">Agents</a>
  </nav>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Forge AI Operator</p>
        <h1>Tickets</h1>
      </div>
      <div class="hero-actions">
        <a class="button ghost" href="../actuator/health">Health</a>
        <button id="refreshTickets" class="button">Refresh</button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Recent Work</h2>
          <p>Open a ticket to inspect lane dependencies, agent status, and active strategy step.</p>
        </div>
        <span id="ticketListUpdated" class="muted">loading</span>
      </div>
      <div id="ticketList" class="ticket-list"></div>
      <div id="ticketListError" class="error-box hidden"></div>
    </section>
  </main>

  <script src="./operator-ui.js"></script>
</body>
</html>
