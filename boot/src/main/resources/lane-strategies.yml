forge:
  ai:
    lane-strategies:
      configs:
        analyzer:
          version: 1
          session-mode: single_session
          steps:
            - id: scope_slicing
              title: Scope Slicing
              instruction-refs:
                - additional-instructions/scope-context-usage.md
                - lane-instructions/analyzer/scope-slicing.md
            - id: architect_handoff
              title: Architect Handoff
              instruction-refs:
                - lane-instructions/analyzer/architect-handoff.md
            - id: qa_lead_handoff
              title: QA Lead Handoff
              instruction-refs:
                - lane-instructions/analyzer/qa-lead-handoff.md
            - id: completion
              title: Completion
              instruction-refs:
                - additional-instructions/completion-callback.md
        api:
          version: 1
          session-mode: single_session
          steps:
            - id: preparation
              title: Preparation
              instruction-refs:
                - additional-instructions/preparation-to-work.md
            - id: contract_changes
              title: Contract Changes
              instruction-refs:
                - additional-instructions/api-contract-rules.md
            - id: version_update
              title: Version Update
              instruction-refs:
                - additional-instructions/version-rules.md
            - id: pr
              title: Pull Request
              instruction-refs:
                - additional-instructions/pr-workflow.md
            - id: generation
              title: Generation
              instruction-refs:
                - additional-instructions/generation-workflow.md
                - additional-instructions/api-artifact-generation-rules.md
            - id: completion
              title: Completion
              instruction-refs:
                - lane-instructions/api/completion-content.md
                - additional-instructions/completion-callback.md
    supervised-execution:
      enabled: false
      agents:
        - api
      correction-attempts: 2
