catalog:
  type: service_catalog
  path: "${FORGE_CONFIG_DIR}/services.yaml"
  workspace_root: "${FORGE_WORKSPACE_ROOT}"

selection:
  include_groups: []
  include_services: []
  exclude_services: []

indexing:
  exclude:
    - ".git/**"
    - "**/.git/**"
    - "target/**"
    - "**/target/**"
    - "build/**"
    - "**/build/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - ".venv/**"
    - "**/.venv/**"
    - "var/**"
    - "**/var/**"
    - "logs/**"
    - "**/logs/**"
    - "**/.env"
