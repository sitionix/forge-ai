<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI Jarvis Infrastructure</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="jarvis">
  <main class="shell">
    <section class="jarvis-query-panel">
      <form id="jarvisQueryForm" class="jarvis-query-form">
        <label class="field jarvis-query-message">
          <span>Question</span>
          <textarea id="jarvisQueryText" placeholder="як створюється сайт"></textarea>
        </label>
        <div class="form-actions">
          <button id="sendJarvisQuery" type="submit" class="button">Send</button>
        </div>
      </form>
      <div id="jarvisQueryLoading" class="notice-box hidden">Analyzing the current graph and preparing an answer...</div>
      <div id="jarvisQueryResult" class="jarvis-query-result hidden"></div>
    </section>
  </main>

  <script src="./runtime-config.js"></script>
  <script type="module" src="./operator-ui.js"></script>
</body>
</html>
