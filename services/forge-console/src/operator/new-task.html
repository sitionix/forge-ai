<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI New Task</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="new-task">
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Forge AI Operator</p>
        <h1>New Task</h1>
        <p class="muted">Create an OPEN ticket from the same service catalog used by the just flow.</p>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Task Draft</h2>
          <p>Select services, enter the ticket number, paste the multiline task, then create the OPEN ticket.</p>
        </div>
        <span id="newTaskUpdated" class="muted">loading services</span>
      </div>

      <form id="newTaskForm" class="task-form">
        <label class="field">
          <span>Ticket</span>
          <input id="newTaskTicket" name="ticket" type="text" inputmode="numeric" placeholder="142 or SITIONIX-142" required>
        </label>

        <label class="field">
          <span>Task</span>
          <textarea id="newTaskBody" name="task" rows="14" placeholder="Paste task markdown here..." required></textarea>
        </label>

        <section class="field">
          <div class="field-head">
            <span>Services</span>
            <div class="inline-actions">
              <button id="selectAllServices" type="button" class="link-button">select all</button>
              <button id="clearServices" type="button" class="link-button">clear</button>
            </div>
          </div>
          <div id="serviceOptions" class="service-options"></div>
        </section>

        <div class="form-actions">
          <button id="createTask" type="submit" class="button">Create</button>
        </div>
      </form>

      <div id="newTaskResult" class="task-result hidden"></div>
      <div id="newTaskError" class="error-box hidden"></div>
    </section>
  </main>

  <script src="./runtime-config.js"></script>
  <script src="./operator-ui.js"></script>
</body>
</html>
