<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI Service</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="service">
  <main class="shell services-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Forge AI Operator</p>
        <h1 id="serviceDetailTitle">Service</h1>
        <p id="serviceDetailSubtitle" class="muted">loading</p>
      </div>
      <div class="hero-actions service-hero-actions">
        <div id="serviceDetailStatus" class="service-runtime-status down">
          <span></span>
          <strong>DOWN</strong>
        </div>
        <a class="button ghost" href="./services.html">Services</a>
        <button id="refreshService" class="button">Refresh</button>
      </div>
    </header>

    <div id="servicesActionResult" class="notice-box hidden"></div>
    <div id="servicesError" class="error-box hidden"></div>

    <section class="panel service-detail-panel">
      <div id="operatorServiceDetail" class="operator-service-detail"></div>
    </section>

    <dialog id="defaultServiceDialog" class="task-dialog default-service-dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Default Service</p>
          <h2 id="defaultServiceDialogTitle">Local changes detected</h2>
        </div>
        <button id="cancelDefaultServiceTop" class="button ghost dialog-close" type="button">Cancel</button>
      </div>
      <div class="default-service-dialog-body">
        <p>
          This service has local changes. Choose how to preserve them before switching to the default branch.
        </p>
        <div class="default-service-actions">
          <button class="button" type="button" data-default-mode="COMMIT">Commit</button>
          <button class="button ghost dark" type="button" data-default-mode="STASH">Stash</button>
          <button id="cancelDefaultService" class="button ghost dark" type="button">Cancel</button>
        </div>
      </div>
    </dialog>
  </main>

  <script src="./runtime-config.js"></script>
  <script src="./operator-ui.js"></script>
</body>
</html>
