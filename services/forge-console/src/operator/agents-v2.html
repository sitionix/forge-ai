<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge AI Agents V2</title>
  <link rel="stylesheet" href="./operator-ui.css">
</head>
<body data-page="agents-v2">
  <main class="shell agents-v2-shell">
    <header class="hero compact-hero">
      <div>
        <p class="eyebrow">Forge AI Operator</p>
        <h1>Agents V2</h1>
      </div>
    </header>

    <section class="agents-v2-layout" aria-label="Agents V2 configuration">
      <section class="panel agents-v2-panel">
        <div class="panel-head compact">
          <div>
            <h2>Projects</h2>
          </div>
          <button id="agentsV2CreateProject" class="icon-button" type="button" aria-label="Create project">+</button>
        </div>
        <div id="agentsV2ProjectsError" class="error-box hidden"></div>
        <div id="agentsV2ProjectsList" class="agents-v2-list" aria-live="polite"></div>
      </section>

      <section class="panel agents-v2-panel">
        <div class="panel-head compact">
          <div>
            <h2>Agents</h2>
            <p id="agentsV2AgentsSubtitle">Select a project.</p>
          </div>
          <button id="agentsV2CreateAgent" class="icon-button" type="button" aria-label="Create agent" disabled>+</button>
        </div>
        <div id="agentsV2AgentsError" class="error-box hidden"></div>
        <div id="agentsV2AgentsList" class="agents-v2-list" aria-live="polite"></div>
      </section>
    </section>

    <dialog id="agentsV2ProjectDialog" class="modal-dialog">
      <form id="agentsV2ProjectForm" method="dialog" class="modal-form">
        <div class="modal-head">
          <h2>Create Project</h2>
        </div>
        <div id="agentsV2ProjectModalError" class="error-box hidden"></div>
        <label class="field-label" for="agentsV2ProjectName">Name</label>
        <input id="agentsV2ProjectName" class="text-input" type="text" required maxlength="120">
        <div class="modal-actions">
          <button id="agentsV2ProjectCancel" class="button secondary" type="button">Cancel</button>
          <button id="agentsV2ProjectSave" class="button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="agentsV2AgentDialog" class="modal-dialog wide">
      <form id="agentsV2AgentForm" method="dialog" class="modal-form">
        <div class="modal-head">
          <h2 id="agentsV2AgentModalTitle">Create Agent</h2>
        </div>
        <div id="agentsV2AgentModalError" class="error-box hidden"></div>
        <label class="field-label" for="agentsV2AgentName">Name</label>
        <input id="agentsV2AgentName" class="text-input" type="text" required maxlength="120">
        <label class="field-label" for="agentsV2AgentInstructions">Instructions</label>
        <textarea id="agentsV2AgentInstructions" class="agent-modal-textarea" required></textarea>
        <label class="field-label" for="agentsV2AgentOutputJson">Output JSON</label>
        <textarea id="agentsV2AgentOutputJson" class="agent-modal-textarea code" required spellcheck="false"></textarea>
        <div id="agentsV2AgentJsonError" class="field-error hidden"></div>
        <fieldset class="dependency-fieldset">
          <legend>Depends on</legend>
          <div id="agentsV2AgentDependencies" class="dependency-options"></div>
        </fieldset>
        <div class="modal-actions">
          <button id="agentsV2AgentCancel" class="button secondary" type="button">Cancel</button>
          <button id="agentsV2AgentSave" class="button" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="./runtime-config.js"></script>
  <script type="module">
    import { bootstrapOperatorConsole } from './operator-bootstrap.js';
    bootstrapOperatorConsole();
  </script>
</body>
</html>
