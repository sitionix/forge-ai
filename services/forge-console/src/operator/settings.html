<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forge AI Settings</title><link rel="stylesheet" href="./operator-ui.css"></head>
<body data-page="settings">
<main class="shell settings-shell">
  <header class="panel"><h1>Settings</h1><h2>Integrations</h2><p>Manage global MCP connections and choose which tools and projects may use them.</p></header>
  <div id="mcpError" class="error-box" role="alert" hidden></div>
  <button id="mcpRetry" class="button secondary" type="button" hidden>Refresh confirmed state</button>
  <p id="mcpNotice" role="status" aria-live="polite"></p>
  <section id="mcpLogin" class="panel" hidden>
    <h2>Operator sign in</h2>
    <form id="mcpLoginForm" autocomplete="off"><label for="mcpOperatorSecret">Operator credential</label><input id="mcpOperatorSecret" type="password" autocomplete="off" required><button class="button" type="submit">Sign in</button></form>
  </section>
  <section id="mcpManagement" hidden>
    <div class="panel mcp-actions"><button id="mcpAdd" class="button" type="button">Add Custom MCP</button><button id="mcpRefresh" class="button secondary" type="button">Refresh</button><button id="mcpLogout" class="button secondary" type="button">Sign out</button></div>
    <section class="panel"><h2>Connected MCP</h2><div id="mcpConnections" aria-live="polite"></div></section>
    <section id="mcpDetailsPanel" class="panel" hidden><h2>Connection details</h2><div id="mcpDetails"></div><div class="mcp-actions"><button id="mcpEdit" class="button" type="button">Edit connection and access</button><button id="mcpTest" class="button secondary" type="button">Test connection</button><button id="mcpToggle" class="button secondary" type="button">Enable</button><button id="mcpRemove" class="button secondary" type="button">Remove</button></div></section>
  </section>
</main>
<script src="./runtime-config.js"></script><script type="module" src="./operator-ui.js"></script>
</body></html>
