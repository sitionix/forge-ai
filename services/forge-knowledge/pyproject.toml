[project]
name = "knowledge-service"
version = "0.1.0"
description = "Local catalog-driven Knowledge inventory and keyword search service"
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.22.0",
  "pydantic>=1.10.0,<2.0.0",
  "pyyaml>=6.0.1",
  "tree-sitter>=0.21.0,<0.22.0",
  "tree-sitter-java>=0.21.0,<0.22.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
