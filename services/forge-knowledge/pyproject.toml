[project]
name = "knowledge-service"
version = "0.1.0"
description = "Local catalog-driven Knowledge inventory and keyword search service"
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.22.0",
  "pydantic>=1.10.0,<2.0.0",
  "httpx>=0.27.0",
  "langdetect>=1.0.9,<2.0.0",
  "pyyaml>=6.0.1",
  "tree-sitter>=0.21.0,<0.22.0",
  "tree-sitter-java>=0.21.0,<0.22.0",
]

[project.optional-dependencies]
test = [
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:launch_testing_ros -p no:launch_testing"
markers = [
  "forge_it: service-level Forge integration tests",
]

[tool.ruff]
line-length = 160
target-version = "py38"

[tool.mypy]
python_version = "3.8"
mypy_path = "src"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "knowledge_service.analysis_schema",
  "knowledge_service.analysis_store",
  "knowledge_service.graph_analysis",
  "knowledge_service.java_parser_adapter",
  "knowledge_service.source_catalog",
  "knowledge_service.structural_analysis",
]
ignore_errors = true
