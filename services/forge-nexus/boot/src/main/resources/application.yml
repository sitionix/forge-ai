environment: localhost
server:
  port: 9099
  servlet:
    context-path: /fgaisox
spring:
  cloud:
    openfeign:
      lazy-attributes-resolution: true
  config:
    import:
      - optional:file:${FORGE_CONFIG_DIR:./config}/forge-ai.yaml
      - optional:file:${FORGE_CONFIG_DIR:./config}/services.yaml
      - optional:file:${FORGE_CONFIG_DIR:./config}/agent.yml
      - optional:file:${FORGE_CONFIG_DIR:./config}/instructions.yaml
      - optional:file:${FORGE_CONFIG_DIR:./config}/lane-strategies.yml
      - optional:classpath:services.yaml
      - optional:classpath:agent.yml
      - optional:classpath:instructions.yaml
      - optional:classpath:lane-strategies.yml
  docker:
    compose:
      file: compose.yaml
  mvc:
    async:
      request-timeout: -1
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27019/forge_ai}
      uuid-representation: standard
  jpa:
    open-in-view: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
forge:
  ai:
    codex:
      progress:
        enabled: true
        log-agent-message-deltas: false
        log-command-output-deltas: true
        command-output-max-chars-per-line: 2000
        agent-message-max-chars-per-line: 1000
        log-prompts: false
        log-reasoning-summaries: false
        heartbeat-interval: 30s
    operator:
      ticket-terminal:
        enabled: true
        default-verbosity: minimal
        heartbeat-interval: 5s
        heartbeat-timeout: 15s
        stop-on-window-close: true
        auto-open-on-ticket-start: false
        launcher: auto
    launcher:
      default-base-url: ${FORGE_NEXUS_BASE_URL:http://127.0.0.1:9099/fgaisox}
      services-config-resource: ${FORGE_SERVICES_CONFIG_RESOURCE:classpath:services.yaml}
    infrastructure:
      jarvis:
        enabled: true
        base-url: ${FORGE_JARVIS_BASE_URL:http://127.0.0.1:7071}
        connect-timeout: 2s
        read-timeout: 120s
      knowledge:
        enabled: true
        base-url: ${FORGE_KNOWLEDGE_BASE_URL:http://127.0.0.1:7081}
        connect-timeout: 2s
        read-timeout: 120s
forge-ai:
  jobs:
    ready-to-start:
      fixed-delay-ms: 10000
logging:
  level:
    com.sitionix.forgeai.codex.progress: INFO
