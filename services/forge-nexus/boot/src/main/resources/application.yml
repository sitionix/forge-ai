environment: localhost
server:
  forward-headers-strategy: none
  address: ${FORGE_NEXUS_HOST:}
  port: 9099
  tomcat:
    accesslog:
      condition-unless: forgeSensitiveRequest
  servlet:
    context-path: /fgaisox
spring:
  config:
    import:
      - optional:file:${FORGE_CONFIG_DIR:./config}/forge-ai.yaml
  docker:
    compose:
      file: compose.yaml
  mvc:
    async:
      request-timeout: -1
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
forge:
  llm:
    authorization:
      browser-origin: ${FORGE_LLM_BROWSER_ORIGIN:http://127.0.0.1:9099}
      binding-ttl: ${FORGE_LLM_BROWSER_BINDING_TTL:12h}
  mcp:
    catalog:
      agent-read-timeout: ${FORGE_MCP_CATALOG_AGENT_READ_TIMEOUT:55s}
  ai:
    infrastructure:
      jarvis:
        enabled: true
        base-url: ${FORGE_JARVIS_BASE_URL:http://127.0.0.1:7071}
        connect-timeout: 2s
        read-timeout: 120s
      knowledge:
        enabled: true
        base-url: ${FORGE_KNOWLEDGE_BASE_URL:http://127.0.0.1:7081}
        connect-timeout: 2s
        read-timeout: 120s
      agent:
        enabled: true
        base-url: ${FORGE_AGENT_BASE_URL:http://127.0.0.1:7091}
        connect-timeout: 2s
        read-timeout: 30s

# Spring's resolved-exception DEBUG output includes raw transport messages.
# Public scoped handlers log safe operational warnings instead.
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: WARN
