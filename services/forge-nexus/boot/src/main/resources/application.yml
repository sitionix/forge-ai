environment: localhost
server:
  port: 9099
  servlet:
    context-path: /fgaisox
spring:
  config:
    import:
      - optional:file:${FORGE_CONFIG_DIR:./config}/forge-ai.yaml
  docker:
    compose:
      file: compose.yaml
  mvc:
    async:
      request-timeout: -1
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
forge:
  ai:
    infrastructure:
      jarvis:
        enabled: true
        base-url: ${FORGE_JARVIS_BASE_URL:http://127.0.0.1:7071}
        connect-timeout: 2s
        read-timeout: 120s
      knowledge:
        enabled: true
        base-url: ${FORGE_KNOWLEDGE_BASE_URL:http://127.0.0.1:7081}
        connect-timeout: 2s
        read-timeout: 120s
      agent:
        enabled: true
        base-url: ${FORGE_AGENT_BASE_URL:http://127.0.0.1:7091}
        connect-timeout: 2s
        read-timeout: 30s
