server:
  address: ${FORGE_AGENT_HOST:}
  port: ${FORGE_AGENT_PORT:7091}
spring:
  application:
    name: forge-agent
  datasource:
    url: ${FORGE_AGENT_DB_URL:jdbc:postgresql://localhost:54329/forge_agent}
    username: ${FORGE_AGENT_DB_USERNAME:forge_agent}
    password: ${FORGE_AGENT_DB_PASSWORD:forge_agent}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
forge:
  mcp:
    enabled: ${FORGE_MCP_ENABLED:false}
    registry:
      base-url: ${FORGE_MCP_REGISTRY_BASE_URL:https://registry.modelcontextprotocol.io}
      connect-timeout: ${FORGE_MCP_REGISTRY_CONNECT_TIMEOUT:3s}
      read-timeout: ${FORGE_MCP_REGISTRY_READ_TIMEOUT:5s}
    runtime:
      helper: ${FORGE_MCP_RUNTIME_HELPER:/usr/local/libexec/forge-runtime-launcher}
  agent:
    codex:
      app-server:
        command: ${FORGE_AGENT_CODEX_COMMAND:codex,app-server,--stdio}
        runtime-cwd: ${FORGE_AGENT_CODEX_RUNTIME_CWD:}
        request-timeout: ${FORGE_AGENT_CODEX_REQUEST_TIMEOUT:15s}
        turn-timeout: ${FORGE_AGENT_CODEX_TURN_TIMEOUT:90m}
        stdio-frame-limit-bytes: ${FORGE_AGENT_CODEX_STDIO_FRAME_LIMIT_BYTES:4194304}
        model-list-max-pages: ${FORGE_AGENT_CODEX_MODEL_LIST_MAX_PAGES:20}
        graceful-terminate-timeout: ${FORGE_AGENT_CODEX_GRACEFUL_TERMINATE_TIMEOUT:2s}
        force-kill-timeout: ${FORGE_AGENT_CODEX_FORCE_KILL_TIMEOUT:2s}
    worker:
      scheduling-enabled: ${FORGE_AGENT_WORKER_SCHEDULING_ENABLED:true}
    runtime:
      max-node-runs-per-workflow-run: ${FORGE_AGENT_RUNTIME_MAX_NODE_RUNS_PER_WORKFLOW_RUN:1000}
