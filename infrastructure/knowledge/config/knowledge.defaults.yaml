knowledge:
  service:
    host: 127.0.0.1
    port: 7081

  inventory:
    store_path: infrastructure/knowledge/var/knowledge.sqlite

  indexing:
    chunk_size_chars: 3000
    chunk_overlap_chars: 300
    max_file_size_bytes: 500000

  include_defaults:
    - "**/*.java"
    - "**/*.kt"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/*.xml"
    - "**/pom.xml"
    - "**/README*"

  exclude_defaults:
    - ".git/**"
    - "target/**"
    - "build/**"
    - "dist/**"
    - "node_modules/**"
    - ".venv/**"
    - "var/**"
    - "logs/**"
    - "**/.env"
    - "**/*.class"
    - "**/*.jar"

analysis:
  enabled: true
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5-coder:14b
  request_timeout_seconds: 180
  context_tokens: 8192
  max_attempts_per_file: 3
  repair_attempts_per_file: 1
  max_file_chars: 60000
  max_chunk_chars: 20000
  concurrency: 1
  retry_attempts: 3
