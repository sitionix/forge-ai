catalog:
  type: service_catalog
  path: "/absolute/path/to/forge-ai/boot/src/main/resources/services.yaml"
  workspace_root: "/absolute/path/to/workspace/root"

selection:
  include_groups: []
  include_services: []
  exclude_services: []

indexing:
  exclude:
    - ".git/**"
    - "**/.git/**"
    - "target/**"
    - "**/target/**"
    - "build/**"
    - "**/build/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - ".venv/**"
    - "**/.venv/**"
    - "var/**"
    - "**/var/**"
    - "logs/**"
    - "**/logs/**"
    - "**/.env"
